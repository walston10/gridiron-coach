# Build and deploy the slice to GitHub Pages on every push to master.
# Source: https://github.com/actions/deploy-pages
#
# One-time setup required in the GitHub repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# After that, every push to master will rebuild and redeploy automatically.
# The deployed app lives at: https://walston10.github.io/gridiron-coach/
# Slice direct link:           https://walston10.github.io/gridiron-coach/#kfslice

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Required permissions for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; in-progress runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
